
<div class="login-page">
  <div class="login-card">

    <a routerLink="/" class="login-logo">
      NYS<span>.</span>
    </a>

    <div class="login-heading">
      <span class="login-icon">↗</span>
      <p class="eyebrow">ESPACE SÉCURISÉ</p>
      <h1>Bon retour.</h1>
      <p class="subtitle">
        Connecte-toi pour gérer ton portfolio.
      </p>
    </div>

    <form #formLogin="ngForm" (ngSubmit)="seConnecter()">

      <label for="email">Adresse e-mail</label>
      <input
        id="email"
        type="email"
        name="email"
        [(ngModel)]="email"
        required
        email
        autocomplete="username"
        placeholder="admin@exemple.com"
      />

      <label for="motDePasse">Mot de passe</label>

      <div class="password-wrapper">
        <input
          id="motDePasse"
          [type]="afficherMotDePasse ? 'text' : 'password'"
          name="motDePasse"
          [(ngModel)]="motDePasse"
          required
          autocomplete="current-password"
          placeholder="Ton mot de passe"
        />

        <button
          type="button"
          class="show-password"
          (click)="afficherMotDePasse = !afficherMotDePasse"
          [attr.aria-label]="afficherMotDePasse
            ? 'Masquer le mot de passe'
            : 'Afficher le mot de passe'"
        >
          {{ afficherMotDePasse ? 'Masquer' : 'Afficher' }}
        </button>
      </div>

      @if (messageErreur) {
        <p class="error-message" role="alert">
          {{ messageErreur }}
        </p>
      }

    <p style="font-size: 12px; color: #888;">
      Formulaire valide : {{ formLogin.valid }} |
      Chargement : {{ chargement }}
    </p>

      <button
        type="submit"
        class="login-button"
        [disabled]="formLogin.invalid"
      >
        Se connecter <span>→</span>
      </button>

    </form>

    <a routerLink="/" class="back-link">
      ← Retour au portfolio
    </a>

    <p class="security-note">
      NYS · Administration du portfolio
    </p>

  </div>
</div>
